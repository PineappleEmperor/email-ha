query_emails:
  name: Query emails
  description: >
    Search an IMAP folder using standard IMAP search criteria and return
    matching emails. Use the response variable to access the results in
    automations or scripts.
  fields:
    config_entry_id:
      name: Account
      description: The email account to query.
      required: false
      selector:
        config_entry:
          integration: email_ha
    folder:
      name: Folder
      description: IMAP folder to search (e.g. INBOX, Sent, Spam).
      default: INBOX
      selector:
        text: {}
    search_criteria:
      name: Search criteria
      description: >
        IMAP search string. Examples: ALL, UNSEEN,
        FROM user@example.com, SUBJECT "invoice", SINCE 01-Jan-2025.
      default: ALL
      selector:
        text: {}
    max_results:
      name: Maximum results
      description: Maximum number of emails to return (1–200).
      default: 10
      selector:
        number:
          min: 1
          max: 200
          mode: box
    include_full_body:
      name: Include full body
      description: Return the complete plain-text and HTML body. Off by default to keep responses small.
      default: false
      selector:
        boolean: {}
    include_attachments:
      name: Include attachments
      description: Return attachments as base64-encoded data with filename, content type, and size. Can produce large responses.
      default: false
      selector:
        boolean: {}
